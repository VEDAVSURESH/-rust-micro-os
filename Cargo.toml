[package]
name = "rust-micro-os"
version = "0.1.0"
edition = "2021"
authors = ["Vedav"]
description = "An educational Rust Micro-OS"

[dependencies]
bootloader = "0.9.23"
x86_64 = { version = "0.14.12", default-features = false, features = ["instructions", "abi_x86_interrupt"] }

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
test-timeout = 300
